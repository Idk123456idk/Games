<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>Pong</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#f3f7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}.wrap{width:min(100vw,800px);padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.title{font-size:20px;font-weight:750;letter-spacing:.08em}.score{font-size:24px;font-variant-numeric:tabular-nums;font-weight:700}.hint{color:#9eacc2;font-size:13px;text-align:center;margin-top:8px}canvas{display:block;width:100%;height:auto;max-height:78vh;aspect-ratio:3/2;background:#080e18;border:1px solid #2d3b52;border-radius:12px;touch-action:none}button{border:0;border-radius:999px;padding:9px 16px;background:#26364e;color:#f3f7ff;font:600 14px system-ui}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="title">PONG</div><div class="score"><span id="player">0</span> : <span id="cpu">0</span></div><button id="restart">Neustart</button></div><canvas id="game" width="900" height="600" aria-label="Pong-Spiel"></canvas><div class="hint">Bewege deinen Schläger durch Tippen oder Ziehen auf dem Spielfeld.</div></div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const p={x:30,y:H/2-55,w:16,h:110}, ai={x:W-46,y:H/2-55,w:16,h:110};
let ball,ps=0,as=0,active=true,last=0;
const score=()=>{document.getElementById('player').textContent=ps;document.getElementById('cpu').textContent=as};
function serve(dir){ball={x:W/2,y:H/2,r:11,vx:dir*5.2,vy:(Math.random()-.5)*5}}
function reset(){ps=as=0;score();active=true;serve(Math.random()<.5?-1:1)}
function movePaddle(clientY){const r=c.getBoundingClientRect();p.y=Math.max(0,Math.min(H-p.h,(clientY-r.top)*H/r.height-p.h/2))}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);movePaddle(e.clientY)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')movePaddle(e.clientY)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')p.y=Math.max(0,p.y-28);if(e.key==='ArrowDown')p.y=Math.min(H-p.h,p.y+28)});
document.getElementById('restart').addEventListener('click',reset);
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080e18';ctx.fillRect(0,0,W,H);ctx.setLineDash([12,14]);ctx.strokeStyle='#34445d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,12);ctx.lineTo(W/2,H-12);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#68e1c2';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#ffb86b';ctx.fillRect(ai.x,ai.y,ai.w,ai.h);ctx.fillStyle='#f3f7ff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();}
function tick(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(active){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y<ball.r||ball.y>H-ball.r)ball.vy*=-1;const target=ball.y-ai.h/2;ai.y+=Math.max(-4.2,Math.min(4.2,target-ai.y))*dt;ai.y=Math.max(0,Math.min(H-ai.h,ai.y));if(ball.vx<0&&ball.x-ball.r<p.x+p.w&&ball.x>p.x&&ball.y>p.y&&ball.y<p.y+p.h){ball.x=p.x+p.w+ball.r;ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-(p.y+p.h/2))*.075}if(ball.vx>0&&ball.x+ball.r>ai.x&&ball.x<ai.x+ai.w&&ball.y>ai.y&&ball.y<ai.y+ai.h){ball.x=ai.x-ball.r;ball.vx=-Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-(ai.y+ai.h/2))*.065}if(ball.x<0){as++;score();serve(1)}if(ball.x>W){ps++;score();serve(-1)}}draw();requestAnimationFrame(tick)}
reset();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
